# =============================================================================
# Стек гибридного сервиса контроля качества DXA/ДРА (наработки от астры).
#
#   1) dxaqc   — ИИ-сервис (пакет src/), GPU (2 x H200 / любая NVIDIA CUDA 12);
#   2) orthanc — мини-PACS для демонстрации обмена DICOM.
#
# Пакетный инференс:
#   docker compose run --rm dxaqc src.predict --input /data/input --output /data/output/results.csv
#
# Обучение (CV + финальная модель):
#   docker compose run --rm dxaqc src.train --manifest artifacts/manifest.csv
#
# Требуется NVIDIA Container Toolkit на хосте:
#   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
# =============================================================================

services:
  dxaqc:
    build:
      context: .
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu124
    image: dxa-qc-hybrid:gpu
    volumes:
      - ./data:/data/input:ro
      - ./out:/data/output
      - ./artifacts:/app/artifacts
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all              # 2 x H200: доступны все GPU
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import src.inference, torch"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  orthanc:
    image: orthancteam/orthanc:latest
    ports:
      - "8042:8042"
      - "4242:4242"
    environment:
      ORTHANC__NAME: "DXA-SANDBOX"
      ORTHANC__AUTHENTICATION_ENABLED: "false"
      DICOM_WEB_PLUGIN_ENABLED: "true"
      STONE_WEB_VIEWER_PLUGIN_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - orthanc-db:/var/lib/orthanc/db

volumes:
  orthanc-db:
